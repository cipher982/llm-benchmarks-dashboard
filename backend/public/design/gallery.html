/* The shell is deliberately quiet and dark-only: it frames five dark mocks,
   and a light chrome around them would read as a rendering fault. */
:root {
  --shell-ground: #0F0F11;
  --shell-rail:   #17171A;
  --shell-rule:   #26262B;
  --shell-text:   #EDEDEB;
  --shell-dim:    #94948F;
  --shell-mute:   #66665F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--shell-ground); color: var(--shell-text);
  font: 400 15px/1.5 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
}

.shell {
  position: sticky; top: 0; z-index: 20; background: var(--shell-rail);
  border-bottom: 1px solid var(--shell-rule);
}
.shell-in { max-width: 1440px; margin: 0 auto; padding: 14px 24px 0; }
.shell h1 { margin: 0 0 3px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.shell .lede { margin: 0 0 14px; font-size: 13px; color: var(--shell-mute); max-width: 78ch; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button {
  font: 500 13px 'Archivo', system-ui, sans-serif; color: var(--shell-dim);
  background: transparent; border: 1px solid var(--shell-rule); border-bottom: 0;
  padding: 9px 15px; cursor: pointer; border-radius: 5px 5px 0 0;
  display: flex; align-items: baseline; gap: 8px;
}
.tabs button:hover { color: var(--shell-text); background: #1E1E22; }
.tabs button[aria-selected="true"] {
  color: #0F0F11; background: var(--shell-text); border-color: var(--shell-text);
}
.tabs .key { font: 500 10px/1 'Spline Sans Mono', monospace; opacity: .55; letter-spacing: .06em; }
.tabs button:focus-visible { outline: 2px solid #7FA8FF; outline-offset: 2px; }

.about { max-width: 1440px; margin: 0 auto; padding: 18px 24px 20px;
  display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start;
  border-bottom: 1px solid var(--shell-rule); }
.about p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--shell-dim); max-width: 70ch; }
.about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12px; }
.about dt { color: var(--shell-mute); font: 400 10px/1.6 'Spline Sans Mono', monospace;
  letter-spacing: .1em; text-transform: uppercase; }
.about dd { margin: 0; color: var(--shell-dim); }

.stage { display: none; }
.stage[data-active] { display: block; }

@media (max-width: 860px) {
  .about { grid-template-columns: 1fr; gap: 18px; }
  .shell .lede { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .stage[data-active] { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
}

/**
 * Chart geometry shared by the Phase 1 bake-off variants.
 *
 * These return SVG markup with no colours of their own — every stroke and fill
 * resolves through `currentColor` or a CSS custom property, so each variant
 * restyles the same geometry from its own stylesheet. That keeps the comparison
 * about design rather than about who got a nicer chart implementation.
 */

async function loadData() {
  const res = await fetch('./data.json');
  return res.json();
}

const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');

/**
 * Ridgeline: one normalised density curve per model, sorted, overlapping.
 * Replaces ~120 KDE curves stacked in a single frame.
 */
function ridgeline(
  ridge,
  { width = 720, rowHeight = 26, overlap = 2.1, labelWidth = 0, colorFor = null } = {},
) {
  const rows = ridge.rows;
  const w = width - labelWidth;
  const amp = rowHeight * overlap;
  const height = rowHeight * rows.length + amp;

  const body = rows
    .map((row, i) => {
      const baseY = amp + i * rowHeight;
      // Trim the near-zero tails. Drawing them produces a flat rule across the
      // full width of every row, which reads as chart furniture rather than data.
      const [lo, hi] = support(row.curve, 0.025);
      const pts = row.curve.slice(lo, hi + 1).map((y, j) => [
        labelWidth + ((lo + j) / (row.curve.length - 1)) * w,
        baseY - y * amp,
      ]);
      const x0 = pts[0][0];
      const x1 = pts[pts.length - 1][0];
      const area = `${path(pts)}L${x1.toFixed(1)} ${baseY}L${x0.toFixed(1)} ${baseY}Z`;
      const meanX = labelWidth + Math.min(row.mean / ridge.xMax, 1) * w;
      // A variant may map row position onto a sequential ramp; otherwise every
      // stroke stays on currentColor and the stylesheet decides.
      const tint = colorFor ? `;--c:${colorFor(i, rows.length)}` : '';
      return `<g class="ridge-row" data-provider="${row.provider}" style="--i:${i};--n:${rows.length}${tint}">
        <path class="ridge-area" d="${area}"/>
        <path class="ridge-line" d="${path(pts)}"/>
        <circle class="ridge-mean" cx="${meanX.toFixed(1)}" cy="${baseY.toFixed(1)}" r="2"/>
      </g>`;
    })
    .reverse() // draw slowest first so faster rows sit in front
    .join('');

  const step = ridge.xMax > 400 ? 100 : ridge.xMax > 150 ? 50 : 25;
  const ticks = Array.from({ length: Math.floor(ridge.xMax / step) + 1 }, (_, i) => i * step)
    .filter((t) => t <= ridge.xMax)
    .map((t) => {
      const x = labelWidth + (t / ridge.xMax) * w;
      return `<g class="ridge-tick"><line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${height}"/>
        <text x="${x.toFixed(1)}" y="${height + 14}">${t}</text></g>`;
    })
    .join('');

  return `<svg class="chart ridge" viewBox="0 0 ${width} ${height + 22}" width="100%" role="img"
    aria-label="Throughput distribution by model, fastest at top">
    <g class="ridge-ticks">${ticks}</g>${body}</svg>`;
}

/** First and last index whose normalised density clears `eps`. */
function support(curve, eps) {
  let lo = curve.findIndex((y) => y > eps);
  let hi = curve.length - 1 - [...curve].reverse().findIndex((y) => y > eps);
  if (lo < 0) return [0, curve.length - 1];
  return [Math.max(0, lo - 1), Math.min(curve.length - 1, hi + 1)];
}

/**
 * Labels for a ridgeline, emitted as HTML so they stay selectable text.
 * The same model name appears under several providers, so the provider is part
 * of the label rather than an afterthought.
 */
function ridgeLabels(ridge, { rowHeight = 26, overlap = 2.1 } = {}) {
  const amp = rowHeight * overlap;
  return ridge.rows
    .map(
      (row, i) => `<li style="top:${(amp + i * rowHeight - 7).toFixed(1)}px">
        <span class="rl-model">${row.model} <i>${row.provider}</i></span>
        <span class="rl-mean"><b>${row.mean}</b> tok/s</span>
      </li>`,
    )
    .join('');
}

/**
 * Small-multiples grid: one cell per model on a shared y-scale.
 * Replaces 22 stacked full-width charts.
 */
function smallMultiples(series, { cellWidth = 210, cellHeight = 64 } = {}) {
  const all = series.models.flatMap((m) => m.values).filter((v) => v != null);
  const yMax = Math.max(...all) * 1.08;

  return series.models
    .map((m) => {
      const vals = m.values;
      const pts = vals
        .map((v, i) => [(i / (vals.length - 1)) * cellWidth, cellHeight - (v / yMax) * cellHeight])
        .filter((_, i) => vals[i] != null);
      const mean = vals.filter((v) => v != null).reduce((a, b) => a + b, 0) / vals.filter((v) => v != null).length;
      const meanY = cellHeight - (mean / yMax) * cellHeight;
      const area = `${path(pts)}L${cellWidth} ${cellHeight}L0 ${cellHeight}Z`;
      return `<figure class="sm-cell" data-provider="${m.provider}">
        <figcaption>
          <span class="sm-model">${m.model}</span>
          <span class="sm-provider">${m.provider}</span>
          <span class="sm-value">${mean.toFixed(0)}<i>tok/s</i></span>
        </figcaption>
        <svg class="chart sm" viewBox="0 0 ${cellWidth} ${cellHeight}" width="100%" preserveAspectRatio="none"
          role="img" aria-label="${m.model} throughput over the window, mean ${mean.toFixed(0)} tokens per second">
          <line class="sm-mean" x1="0" y1="${meanY.toFixed(1)}" x2="${cellWidth}" y2="${meanY.toFixed(1)}"/>
          <path class="sm-area" d="${area}"/>
          <path class="sm-line" d="${path(pts)}"/>
        </svg>
      </figure>`;
    })
    .join('');
}

/** Inline trend mark for a table row. */
function sparkline(values, { width = 88, height = 18, yMax } = {}) {
  const clean = values.filter((v) => v != null);
  if (clean.length < 2) return '';
  const max = yMax ?? Math.max(...clean);
  const min = Math.min(...clean);
  const span = max - min || 1;
  const pts = values
    .map((v, i) => [(i / (values.length - 1)) * width, height - ((v - min) / span) * height])
    .filter((_, i) => values[i] != null);
  return `<svg class="chart spark" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" aria-hidden="true">
    <path class="spark-line" d="${path(pts)}"/></svg>`;
}

/**
 * Min–mean–max strip on a shared scale. Puts the distribution inside the table
 * row instead of in a separate chart, which is the whole premise of variant B.
 */
function rangeStrip(row, { scaleMax, width = 200, height = 14 } = {}) {
  const x = (v) => Math.max(0, Math.min(1, v / scaleMax)) * width;
  const mid = height / 2;
  return `<svg class="chart range" viewBox="0 0 ${width} ${height}" width="100%" height="${height}"
    preserveAspectRatio="none" role="img"
    aria-label="${row.min} to ${row.max} tokens per second, mean ${row.mean}">
    <line class="rg-track" x1="0" y1="${mid}" x2="${width}" y2="${mid}"/>
    <line class="rg-span" x1="${x(row.min).toFixed(1)}" y1="${mid}" x2="${x(row.max).toFixed(1)}" y2="${mid}"/>
    <circle class="rg-mean" cx="${x(row.mean).toFixed(1)}" cy="${mid}" r="3"/>
  </svg>`;
}

/** Deterministic pseudo-series so every table row can carry a trend mark. */
function seriesFor(series, model) {
  const hit = series.models.find((m) => m.model === model);
  return hit ? hit.values : null;
}

const fmt = {
  int: (n) => (n == null ? '—' : Math.round(n).toLocaleString()),
  dec: (n, d = 1) => (n == null ? '—' : n.toFixed(d)),
  pct: (n) => (n == null ? '—' : `${n.toFixed(0)}%`),
  date: (iso) =>
    new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }),
};

ont-weight: 500; }\n.ridgeplot { padding: 18px 20px 8px; overflow: hidden; }\n.ridge { display: block; }\n.ridge-area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }\n.ridge-line { fill: none; stroke: var(--accent); stroke-width: 1.15; stroke-linejoin: round;\n  opacity: calc(0.42 + 0.58 * (var(--n) - var(--i)) / var(--n)); }\n.ridge-row { --lift: 0; }\n.ridge-row .ridge-area { opacity: calc(0.35 + 0.65 * (var(--n) - var(--i)) / var(--n)); }\n.ridge-mean { fill: var(--text); }\n.ridge-tick line { stroke: var(--rule-soft); stroke-width: 1; }\n.ridge-tick text { fill: var(--text-mute); font: 400 10px var(--mono); text-anchor: middle; }\n.axlabel { display: flex; justify-content: space-between; padding: 4px 20px 16px;\n  font: 400 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); }\n\n/* ---------- table ---------- */\n.tablewrap { border: 1px solid var(--rule); background: var(--surface); overflow: hidden; }\ntable { width: 100%; border-collapse: collapse; }\nthead th { text-align: right; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase;\n  color: var(--text-mute); padding: 13px 16px; border-bottom: 1px solid var(--rule); background: var(--raised); }\nthead th:first-child, thead th.l { text-align: left; }\ntbody td { padding: 11px 16px; border-bottom: 1px solid var(--rule-soft); text-align: right;\n  font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }\ntbody td.l { text-align: left; font-family: var(--sans); font-size: 14px; }\ntbody tr:last-child td { border-bottom: 0; }\ntbody tr:hover { background: var(--raised); }\n.rank { color: var(--text-mute); width: 44px; }\n.model b { font-weight: 500; }\n.prov { color: var(--text-dim); font-family: var(--mono) !important; font-size: 12px !important;\n  letter-spacing: .02em; }\n.lead { color: var(--accent); }\ntd.spark-cell { width: 104px; padding-right: 20px; }\n.spark-line { fill: none; stroke: var(--text-mute); stroke-width: 1.1; }\ntr:hover .spark-line { stroke: var(--text); }\n.bar { position: relative; }\n.bar::before { content: ''; position: absolute; left: 16px; right: 16px; bottom: 4px; height: 2px;\n  background: var(--rule); }\n.bar::after { content: ''; position: absolute; left: 16px; bottom: 4px; height: 2px;\n  width: calc((100% - 32px) * var(--f)); background: var(--accent); opacity: .75; }\n\n/* ---------- small multiples ---------- */\n.smgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule);\n  border: 1px solid var(--rule); }\n.sm-cell { margin: 0; background: var(--surface); padding: 14px 16px 10px; }\n.sm-cell figcaption { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }\n.sm-model { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.sm-provider { grid-row: 2; font: 400 10.5px var(--mono); letter-spacing: .1em;\n  text-transform: uppercase; color: var(--text-mute); }\n.sm-value { grid-row: 1 / span 2; align-self: center; font-family: var(--mono); font-size: 19px;\n  font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }\n.sm-value i { font-style: normal; font-size: 10px; color: var(--text-mute); margin-left: 3px; }\n.sm { height: 52px; }\n.sm-area { fill: color-mix(in srgb, var(--accent) 9%, transparent); }\n.sm-line { fill: none; stroke: var(--accent); stroke-width: 1.2; vector-effect: non-scaling-stroke; }\n.sm-mean { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }\n\n/* ---------- footer ---------- */\nfooter { border-top: 1px solid var(--rule); padding: 40px 0 64px; margin-top: 40px; }\nfooter .wrap { display: flex; gap: 40px; align-items: flex-start; }\nfooter p { margin: 0; color: var(--text-mute); font-size: 13px; max-width: 46ch; }\nfooter .links { margin-left: auto; display: flex; gap: 26px; font-family: var(--mono); font-size: 12px; }\nfooter .links a { color: var(--text-dim); text-decoration: none; }\nfooter .links a:hover { color: var(--text); }\n\n@media (max-width: 900px) {\n  .wrap { padding: 0 20px; }\n  h1 { font-size: 32px; }\n  .readout, .picks, .smgrid { grid-template-columns: 1fr 1fr; }\n  .ridgewrap { grid-template-columns: 1fr; }\n  .ridgelabels { display: none; }\n}\n",
    html: "<header class=\"top\">\n  <div class=\"wrap\">\n    <span class=\"mark\"><span class=\"dot\"></span>llm-benchmarks</span>\n    <nav class=\"main\">\n      <a href=\"#\" aria-current=\"page\">Cloud</a>\n      <a href=\"#\">Local</a>\n      <a href=\"#\">Status</a>\n      <a href=\"#\">Guides</a>\n    </nav>\n    <span class=\"right\">\n      <span><span class=\"pulse\"></span>collecting</span>\n      <span id=\"stamp\"></span>\n    </span>\n  </div>\n</header>\n\n<div class=\"wrap\">\n  <div class=\"lede\">\n    <div>\n      <p class=\"eyebrow\">Cloud inference · continuous measurement</p>\n      <h1>Token throughput, <em>measured every two hours.</em></h1>\n      <p>Cron jobs sample generation speed from every major inference provider and record what\n         came back. No vendor-supplied numbers, no synthetic scores — just what the API did,\n         sampled continuously across a rolling window.</p>\n    </div>\n    <dl class=\"readout\" id=\"readout\"></dl>\n  </div>\n</div>\n\n<div class=\"tickrule\"></div>\n<section class=\"wrap\">\n  <div class=\"shead\">\n    <h2>Where to start</h2>\n    <p>Leaders in the current window</p>\n  </div>\n  <div class=\"picks\" id=\"picks\"></div>\n</section>\n\n<div class=\"tickrule\"></div>\n<section class=\"wrap\">\n  <div class=\"shead\">\n    <h2>Throughput distribution</h2>\n    <p>Sample density per model, fastest first</p>\n    <div class=\"ctl\">\n      <button>1D</button><button>3D</button><button>7D</button>\n      <button aria-pressed=\"true\">14D</button><button>30D</button>\n    </div>\n  </div>\n  <div class=\"ridgewrap\">\n    <ul class=\"ridgelabels\" id=\"ridgelabels\"></ul>\n    <div>\n      <div class=\"ridgeplot\" id=\"ridgeplot\"></div>\n      <div class=\"axlabel\"><span>tokens / second</span><span>n = 22 models</span></div>\n    </div>\n  </div>\n</section>\n\n<div class=\"tickrule\"></div>\n<section class=\"wrap\">\n  <div class=\"shead\">\n    <h2>Full results</h2>\n    <p>Every model in the window, ranked by mean throughput</p>\n    <div class=\"ctl\">\n      <button>1D</button><button>3D</button><button>7D</button>\n      <button aria-pressed=\"true\">14D</button><button>30D</button>\n    </div>\n  </div>\n  <div class=\"tablewrap\">\n    <table>\n      <thead><tr>\n        <th class=\"l\">#</th><th class=\"l\">Model</th><th class=\"l\">Provider</th>\n        <th>Mean</th><th>Range</th><th>Spread</th><th>TTFT</th><th class=\"l\">14d</th>\n      </tr></thead>\n      <tbody id=\"rows\"></tbody>\n    </table>\n  </div>\n</section>\n\n<div class=\"tickrule\"></div>\n<section class=\"wrap\">\n  <div class=\"shead\">\n    <h2>Over time</h2>\n    <p>Shared scale · top 12 by mean throughput</p>\n    <div class=\"ctl\">\n      <button>7D</button><button aria-pressed=\"true\">14D</button><button>30D</button>\n    </div>\n  </div>\n  <div class=\"smgrid\" id=\"smgrid\"></div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n    <p>Measurements run from a dedicated host on a fixed schedule. Method, model catalogue\n       and raw collection code are open.</p>\n    <div class=\"links\"><a href=\"#\">GitHub</a><a href=\"#\">Method</a><a href=\"#\">API</a><a href=\"#\">drose.io</a></div>\n  </div>\n</footer>",
    run: (document) => { 

const d = DATA;

document.getElementById('stamp').textContent =
  `${fmt.date(d.window.from)} → ${fmt.date(d.window.to)}`;

document.getElementById('readout').innerHTML = `
  <div><dt>Models tracked</dt><dd>${d.counts.models}</dd></div>
  <div><dt>Providers</dt><dd>${d.counts.providers}</dd></div>
  <div><dt>Sample interval</dt><dd>2<small>hours</small></dd></div>
  <div><dt>Window</dt><dd>14<small>days</small></dd></div>`;

const pick = (title, val, unit, row, note) => `
  <div class="pick">
    <h3>${title}</h3>
    <div class="big">${val}<small>${unit}</small></div>
    <p class="who"><b>${row.model}</b> <span>on ${row.provider}</span></p>
    <p class="note">${note}</p>
  </div>`;

const f = d.leaders.fastest[0], t = d.leaders.lowestTtft[0], s = d.leaders.mostStable[0];
document.getElementById('picks').innerHTML =
  pick('Highest throughput', fmt.int(f.mean), 'tok/s', f, 'Best for long generations and bulk completion work.') +
  pick('Lowest first-token wait', fmt.dec(t.ttft, 2), 's', t, 'Best where responsiveness is what users feel.') +
  pick('Most stable', fmt.pct(s.spread), 'spread', s, 'Narrowest range between slowest and fastest sample.');

const ridgeOpts = { width: 900, rowHeight: 26, overlap: 2.1 };
document.getElementById('ridgeplot').innerHTML = ridgeline(d.ridge, ridgeOpts);
document.getElementById('ridgelabels').innerHTML = ridgeLabels(d.ridge, ridgeOpts);

const top = d.table[0].mean;
document.getElementById('rows').innerHTML = d.table.map((r, i) => {
  const sp = seriesFor(d.series, r.model);
  return `<tr>
    <td class="l rank">${String(i + 1).padStart(2, '0')}</td>
    <td class="l model"><b>${r.model}</b></td>
    <td class="l prov">${r.provider}</td>
    <td class="bar ${i === 0 ? 'lead' : ''}" style="--f:${(r.mean / top).toFixed(3)}">${fmt.int(r.mean)}</td>
    <td>${fmt.int(r.min)}–${fmt.int(r.max)}</td>
    <td>${fmt.pct(r.spread)}</td>
    <td>${r.ttft == null ? '—' : fmt.dec(r.ttft, 2) + 's'}</td>
    <td class="spark-cell">${sp ? sparkline(sp) : ''}</td>
  </tr>`;
}).join('');

document.getElementById('smgrid').innerHTML = smallMultiples(d.series, { cellWidth: 210, cellHeight: 64 });
 },

cts span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); }\n\n/* ---------- ranked list, the primary form ---------- */\n.blockhead { display: flex; align-items: baseline; gap: 14px; padding: 42px 0 18px; }\n.blockhead h2 { font-size: 17px; margin: 0; }\n.blockhead p { margin: 0; font-size: 13px; color: var(--text-mute); }\n.blockhead .ctl { margin-left: auto; display: flex; gap: 14px; font-family: var(--mono); font-size: 11px; }\n.ctl button { background: 0; border: 0; padding: 0; cursor: pointer; color: var(--text-mute);\n  font: inherit; letter-spacing: .06em; }\n.ctl button[aria-pressed=\"true\"] { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }\n\n.ranks { display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; }\n.ranks ol { list-style: none; margin: 0; padding: 0; }\n.ranks li { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: baseline;\n  padding: 11px 0; border-bottom: 1px solid var(--rule-soft); }\n.ranks .n { font-family: var(--mono); font-size: 12px; color: var(--text-mute); }\n.ranks .nm { font-size: 15px; }\n.ranks .nm i { display: block; font-style: normal; font-size: 11.5px; color: var(--text-mute); margin-top: 1px; }\n.ranks .v { text-align: right; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }\n.ranks .v em { display: block; font-style: normal; font-size: 11px; margin-top: 2px; }\n.up { color: var(--up); } .down { color: var(--down); }\n\n/* ---------- the ledger: distribution lives inside the row ---------- */\n.ledger { width: 100%; border-collapse: collapse; margin-top: 6px; }\n.ledger th { text-align: right; font: 400 10px var(--mono); letter-spacing: .12em; text-transform: uppercase;\n  color: var(--text-mute); padding: 0 0 10px; border-bottom: 1px solid var(--rule); }\n.ledger th.l { text-align: left; }\n.ledger td { padding: 9px 0; border-bottom: 1px solid var(--rule-soft); text-align: right;\n  font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }\n.ledger td.l { text-align: left; font-family: var(--sans); font-size: 14.5px; }\n.ledger td.n { color: var(--text-mute); font-size: 11.5px; width: 34px; text-align: left; }\n.ledger td.p { font-size: 11.5px; color: var(--text-mute); letter-spacing: .04em; text-align: left; width: 100px; }\n.ledger .strip { width: 34%; padding-left: 22px; padding-right: 22px; }\n.ledger tr:hover td { color: var(--text); }\n.rg-track { stroke: var(--rule); stroke-width: 1; }\n.rg-span { stroke: var(--text-dim); stroke-width: 1; }\n.rg-mean { fill: var(--text); }\ntr:hover .rg-span { stroke: var(--text); }\n.spark-line { fill: none; stroke: var(--text-mute); stroke-width: 1; }\ntr:hover .spark-line { stroke: var(--text); }\n.more { padding: 22px 0 0; font-family: var(--mono); font-size: 11.5px; color: var(--text-mute);\n  display: flex; justify-content: center; }\n\n/* ---------- time series, hairline ---------- */\n.smgrid { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 40px; row-gap: 4px; }\n.sm-cell { margin: 0; padding: 16px 0; border-bottom: 1px solid var(--rule-soft); }\n.sm-cell figcaption { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin-bottom: 8px; }\n.sm-model { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.sm-provider { grid-row: 2; font: 400 10.5px var(--mono); color: var(--text-mute); letter-spacing: .06em; }\n.sm-value { grid-row: 1 / span 2; align-self: center; font-family: var(--mono); font-size: 16px;\n  font-variant-numeric: tabular-nums; }\n.sm-value i { font-style: normal; font-size: 9.5px; color: var(--text-mute); margin-left: 3px; }\n.sm { height: 40px; }\n.sm-area { fill: none; }\n.sm-line { fill: none; stroke: var(--text-dim); stroke-width: 1; vector-effect: non-scaling-stroke; }\n.sm-cell:hover .sm-line { stroke: var(--text); }\n.sm-mean { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-s   const v = (x, y) => Math.round(x + (y - x) * t);
  return `rgb(${v(r1, r2)} ${v(g1, g2)} ${v(b1, b2)})`;

rcase; letter-spacing: .04em; }\ntbody tr:nth-child(even) td { background: #0F1113; }\ntbody tr:hover td { background: var(--raised); }\n.st { display: inline-block; width: 6px; height: 6px; margin-right: 7px; vertical-align: 0; }\n.st.ok { background: var(--ok); } .st.warn { background: var(--warn); } .st.bad { background: var(--bad); }\n.rg-track { stroke: var(--rule); } .rg-span { stroke: var(--text-dim); stroke-width: 2; }\n.rg-mean { fill: var(--accent); }\n.spark-line { fill: none; stroke: var(--text-mute); stroke-width: 1; }\ntr:hover .spark-line { stroke: var(--accent); }\n\n.smgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--rule); }\n.sm-cell { margin: 0; background: var(--ground); padding: 10px 12px 8px; }\n.sm-cell figcaption { display: grid; grid-template-columns: 1fr auto; gap: 0 6px; margin-bottom: 7px; }\n.sm-model { font-family: var(--sans); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis;\n  white-space: nowrap; }\n.sm-provider { grid-row: 2; font-size: 9px; color: var(--text-mute); text-transform: uppercase;\n  letter-spacing: .08em; }\n.sm-value { grid-row: 1 / span 2; align-self: center; font-size: 14px; font-weight: 500;\n  letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }\n.sm-value i { font-style: normal; font-size: 8px; color: var(--text-mute); margin-left: 2px; }\n.sm { height: 34px; }\n.sm-area { fill: color-mix(in srgb, var(--accent) 8%, transparent); }\n.sm-line { fill: none; stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; }\n.sm-mean { stroke: var(--rule); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }\n\nfooter { border-top: 1px solid var(--rule); background: var(--surface); }\nfooter .wrap { display: flex; gap: 24px; height: 38px; align-items: center;\n  font-size: 10.5px; color: var(--text-mute); }\nfooter .links { margin-left: auto; display: flex; gap: 18px; }\n\n@media (max-width: 1000px) {\n  .meters { grid-template-columns: repeat(3, 1fr); }\n  .grid2, .smgrid { grid-template-columns: 1fr; }\n  .ridgewrap { grid-template-columns: 1fr; }\n  .ridgelabels { display: none; }\n}\n",
    html: "<header class=\"top\">\n  <div class=\"wrap\">\n    <span class=\"mark\">llm-benchmarks</span>\n    <nav class=\"main\">\n      <a href=\"#\" aria-current=\"page\">Cloud</a><a href=\"#\">Local</a><a href=\"#\">Status</a><a href=\"#\">Guides</a>\n    </nav>\n    <span class=\"right\">\n      <span><span class=\"dot\"></span>collector online</span>\n      <span id=\"stamp\"></span>\n    </span>\n  </div>\n</header>\n\n<dl class=\"meters\" id=\"meters\"></dl>\n\n<div class=\"grid2\">\n  <div class=\"panel\">\n    <div class=\"ph\">Throughput distribution · tok/s\n      <span class=\"ctl\"><button>1D</button><button>3D</button><button>7D</button>\n        <button aria-pressed=\"true\">14D</button><button>30D</button></span>\n    </div>\n    <div class=\"pb ridgewrap\">\n      <ul class=\"ridgelabels\" id=\"ridgelabels\"></ul>\n      <div class=\"ridgeplot\" id=\"ridgeplot\"></div>\n    </div>\n  </div>\n  <div class=\"panel\">\n    <div class=\"ph\">Window leaders</div>\n    <ul class=\"leads\" id=\"leads\"></ul>\n  </div>\n</div>\n\n<div class=\"panel\">\n  <div class=\"ph\">Full results · 40 of 113 models\n    <span class=\"ctl\"><button aria-pressed=\"true\">All</button><button>Active</button><button>Flagged</button></span>\n  </div>\n  <table>\n    <thead><tr>\n      <th class=\"l\">#</th><th class=\"l\">Model</th><th class=\"l\">Provider</th><th class=\"l\">Status</th>\n      <th class=\"l\" style=\"width:20%\">min·mean·max</th>\n      <th>Mean</th><th>Min</th><th>Max</th><th>Spread</th><th>TTFT</th><th>Trend</th>\n    </tr></thead>\n    <tbody id=\"rows\"></tbody>\n  </table>\n</div>\n\n<div class=\"panel\">\n  <div class=\"ph\">Throughput over time · shared scale\n    <span class=\"ctl\"><button>7D</button><button aria-pressed=\"true\">14D</button><button>30D</button></span>\n  </div>\n  <div class=\"smgrid\" id=\"smgrid\"></div>\n</div>\n\n<footer><div class=\"wrap\">\n  <span>sample interval 2h · collector on clifford · method and code open</span>\n     run: (document) => { 

const d = DATA;
document.getElementById('stamp').innerHTML =
  `window <b>${fmt.date(d.window.from)}–${fmt.date(d.window.to)}</b> · <b>${d.window.points}</b> samples`;

const f = d.leaders.fastest[0], t = d.leaders.lowestTtft[0], s = d.leaders.mostStable[0];
document.getElementById('meters').innerHTML = `
  <div><dt>Models</dt><dd>${d.counts.models}</dd></div>
  <div><dt>Providers</dt><dd>${d.counts.providers}</dd></div>
  <div><dt>Interval</dt><dd>2<small>h</small></dd></div>
  <div><dt>Peak throughput</dt><dd>${fmt.int(f.mean)}<small>tok/s</small></dd></div>
  <div><dt>Best TTFT</dt><dd>${fmt.dec(t.ttft, 2)}<small>s</small></dd></div>
  <div><dt>Tightest spread</dt><dd>${fmt.pct(s.spread)}</dd></div>`;

document.getElementById('leads').innerHTML = [
  ['Highest throughput', fmt.int(f.mean), 'tok/s', f],
  ['Lowest first-token wait', fmt.dec(t.ttft, 2), 's', t],
  ['Most stable', fmt.pct(s.spread), 'spread', s],
].map(([k, v, u, r]) => `<li>
  <div class="k">${k}</div>
  <div class="v"><b>${v}</b><span>${u}</span></div>
  <div class="m">${r.model} · ${r.provider}</div></li>`).join('');

const ridgeOpts = { width: 760, rowHeight: 17, overlap: 2.4 };
document.getElementById('ridgeplot').innerHTML = ridgeline(d.ridge, ridgeOpts);
document.getElementById('ridgelabels').innerHTML = ridgeLabels(d.ridge, ridgeOpts);

const scaleMax = Math.max(...d.table.map((r) => r.max));
const state = (r) => (r.spread > 180 ? ['bad', 'unstable'] : r.spread > 110 ? ['warn', 'variable'] : ['ok', 'steady']);
document.getElementById('rows').innerHTML = d.table.map((r, i) => {
  const sp = seriesFor(d.series, r.model);
  const [cls, word] = state(r);
  return `<tr>
    <td class="l n">${String(i + 1).padStart(2, '0')}</td>
    <td class="l nm">${r.model}</td>
    <td class="l p">${r.provider}</td>
    <td class="l p"><span class="st ${cls}"></span>${word}</td>
    <td>${rangeStrip(r, { scaleMax, height: 12 })}</td>
    <td>${fmt.int(r.mean)}</td>
    <td>${fmt.int(r.min)}</td>
    <td>${fmt.int(r.max)}</td>
    <td>${fmt.pct(r.spread)}</td>
    <td>${r.ttft == null ? '—' : fmt.dec(r.ttft, 2)}</td>
    <td>${sp ? sparkline(sp, { width: 56, height: 14 }) : '—'}</td>
  </tr>`;
}).join('');

document.getElementById('smgrid').innerHTML = smallMultiples(d.series, { cellWidth: 190, cellHeight: 46 });
 },

ly: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }\ntbody td.l { text-align: left; font-family: var(--serif); font-size: 17px; padding-left: 0; }\ntbody td.n { font-size: 11px; color: var(--text-mute); width: 42px; text-align: left; padding-left: 0; }\ntbody td.p { font-family: var(--sans); font-size: 11px; color: var(--text-mute); text-align: left;\n  letter-spacing: .06em; text-transform: uppercase; }\ntbody tr:hover td { background: var(--surface); }\n.rg-track { stroke: var(--rule); } .rg-span { stroke: var(--text-dim); stroke-width: 2; }\n.rg-mean { fill: var(--accent); }\n.spark-line { fill: none; stroke: var(--text-mute); stroke-width: 1; }\n\n.smgrid { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 40px; row-gap: 8px; }\n.sm-cell { margin: 0; padding: 18px 0; border-bottom: 1px solid var(--rule-soft); }\n.sm-cell figcaption { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin-bottom: 10px; }\n.sm-model { font-family: var(--serif); font-size: 17px; overflow: hidden; text-overflow: ellipsis;\n  white-space: nowrap; }\n.sm-provider { grid-row: 2; font-family: var(--sans); font-size: 10px; color: var(--text-mute);\n  letter-spacing: .1em; text-transform: uppercase; }\n.sm-value { grid-row: 1 / span 2; align-self: center; font-family: var(--mono); font-size: 16px;\n  font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }\n.sm-value i { font-style: normal; font-size: 9px; color: var(--text-mute); margin-left: 3px; }\n.sm { height: 46px; }\n.sm-area { fill: color-mix(in srgb, var(--accent) 7%, transparent); }\n.sm-line { fill: none; stroke: var(--accent); stroke-width: 1.1; vector-effect: non-scaling-stroke; }\n.sm-mean { stroke: var(--rule); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }\n\nfooter { padding: 40px 0 70px; }\nfooter .wrap { display: flex; gap: 30px; align-items: baseline; }\nfooter p { margin: 0; font-size: 15px; color: var(--text-mute); max-width: 48ch; }     html: "<header class=\"top\">\n  <div class=\"wrap\">\n    <span class=\"mark\">LLM Benchmarks</span>\n    <nav class=\"main\">\n      <a href=\"#\" aria-current=\"page\">Cloud</a><a href=\"#\">Local</a><a href=\"#\">Status</a><a href=\"#\">Guides</a>\n    </nav>\n    <span class=\"right\" id=\"stamp\"></span>\n  </div>\n</header>\n\n<div class=\"wrap\">\n  <div class=\"lede\">\n    <p class=\"kicker\">Cloud inference · continuous measurement</p>\n    <h1>Every provider claims speed. These are the numbers.</h1>\n    <div class=\"deck\">\n      <p><span class=\"drop\">C</span>ron jobs sample token generation speed from every major cloud\n         inference provider on a fixed two-hour schedule and record exactly what the API returned.\n         No vendor-supplied figures, no synthetic benchmarks, no cherry-picked runs — a continuous\n         record of measured throughput across a rolling window.</p>\n      <div class=\"standfirst\">\n        <dl id=\"facts\"></dl>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"pulls\" id=\"pulls\"></div>\n\n  <figure class=\"exhibit\">\n    <div class=\"exhead\">\n      <span class=\"exnum\">Exhibit 1</span>\n      <h2>Where the speed actually lands</h2>\n      <span class=\"ctl\"><button>1D</button><button>3D</button><button>7D</button>\n        <button aria-pressed=\"true\">14D</button><button>30D</button></span>\n    </div>\n    <figcaption class=\"note\">Each ridge is one model's distribution of measured throughput across the\n      window, normalised to its own peak so shapes stay comparable. A wide ridge means the provider\n      is inconsistent; a narrow one means you get what you were promised.</figcaption>\n    <div class=\"ridgewrap\">\n      <ul class=\"ridgelabels\" id=\"ridgelabels\"></ul>\n      <div id=\"ridgeplot\"></div>\n    </div>\n  </figure>\n\n  <figure class=\"exhibit\">\n    <div class=\"exhead\">\n      <span class=\"exnum\">Exhibit 2</span>\n      <h2>Full results</h2>\n      <span class=\"ctl\"><button>All</button><button aria-pressed=\"true\">Active</button><button>Flagged</button></span>\n    </div>\n    <figcaption class=\"note\">Ranked by mean throughput. Spread is the gap between the slowest and\n      fastest sample, as a share of the mean.</figcaption>\n    <table>\n      <thead><tr>\n        <th class=\"l\">#</th><th class=\"l\">Model</th><th class=\"l\">Provider</th>\n        <th class=\"l\" style=\"width:22%\">Range</th>\n        <th>Mean</th><th>Spread</th><th>TTFT</th><th>Trend</th>\n      </tr></thead>\n      <tbody id=\"rows\"></tbody>\n    </table>\n  </figure>\n\n  <figure class=\"exhibit\">\n    <div class=\"exhead\">\n      <span class=\"exnum\">Exhibit 3</span>\n      <h2>Holding steady, or not</h2>\n      <span class=\"ctl\"><button>7D</button><button aria-pressed=\"true\">14D</button><button>30D</button></span>\n    </div>\n    <figcaption class=\"note\">Top twelve by throughput, drawn on a shared vertical scale so the\n      cells can be read against one another. The dashed line is each model's own mean.</figcaption>\n    <div class=\"smgrid\" id=\"smgrid\"></div>\n  </figure>\n</div>\n\n<footer><div class=\"wrap\">\n  <p>Measurements run from a dedicated host on a fixed schedule since 2024.\n     Method, model catalogue and collection code are open.</p>\n  <span class=\"links\"><a href=\"#\">GitHub</a><a href=\"#\">Method</a><a href=\"#\">API</a><a href=\"#\">drose.io</a></span>\n</div></footer>",
    run: (document) => { 

const d = DATA;
document.getElementById('stamp').textContent =
  `${fmt.date(d.window.from)} – ${fmt.date(d.window.to)}`;

document.getElementById('facts').innerHTML = `
  <div><dt>Models</dt><dd>${d.counts.models}</dd></div>
  <div><dt>Providers</dt><dd>${d.counts.providers}</dd></div>
  <div><dt>Interval</dt><dd>2<small>hours</small></dd></div>
  <div><dt>Samples / model</dt><dd>${d.window.points}</dd></div>`;

const f = d.leaders.fastest[0], t = d.leaders.lowestTtft[0], s = d.leaders.mostStable[0];
const pull = (k, v, u, r, why) => `<div class="pull">
  <h3>${k}</h3>
  <div class="num">${v}<small>${u}</small></div>
  <p class="who">${r.model} <i>on ${r.provider}</i></p>
  <p class="why">${why}</p></div>`;
document.getElementById('pulls').innerHTML =
  pull('Fastest', fmt.int(f.mean), 'tok/s', f, 'Highest mean generation speed measured across the window.') +
  pull('Quickest first token', fmt.dec(t.ttft, 2), 's', t, 'Shortest wait before the first token arrives.') +
  pull('Most consistent', fmt.pct(s.spread), 'spread', s, 'Smallest gap between its slowest and fastest sample.');

const ridgeOpts = { width: 880, rowHeight: 24, overlap: 2.2 };
document.getElementById('ridgeplot').innerHTML = ridgeline(d.ridge, ridgeOpts);
document.getElementById('ridgelabels').innerHTML = ridgeLabels(d.ridge, ridgeOpts);

const scaleMax = Math.max(...d.table.map((r) => r.max));
document.getElementById('rows').innerHTML = d.table.map((r, i) => {
  const sp = seriesFor(d.series, r.model);
  return `<tr>
    <td class="n">${String(i + 1).padStart(2, '0')}</td>
    <td class="l">${r.model}</td>
    <td class="p">${r.provider}</td>
    <td>${rangeStrip(r, { scaleMax, height: 14 })}</td>
    <td>${fmt.int(r.mean)}</td>
    <td>${fmt.pct(r.spread)}</td>
    <td>${r.ttft == null ? '—' : fmt.dec(r.ttft, 2) + 's'}</td>
    <td>${sp ? sparkline(sp, { width: 66, height: 16 }) : '—'}</td>
  </tr>`;
}).join('');

document.getElementById('smgrid').innerHTML = smallMultiples(d.series, { cellWidth: 300, cellHeight: 56 });
 },
  }
};

const tabs = document.getElementById('tabs');
const stagesEl = document.getElementById('stages');
const mounted = new Set();

VARIANTS.forEach((v, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.role = 'tab';
  b.id = 'tab-' + v.id;
  b.innerHTML = '<span class="key">' + (i + 1) + '</span>' + v.name;
  b.onclick = () => select(v.id);
  tabs.appendChild(b);

  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.id = 'stage-' + v.id;
  stage.attachShadow({ mode: 'open' });
  stagesEl.appendChild(stage);
});

function select(id) {
  const v = VARIANTS.find((x) => x.id === id);
  for (const b of tabs.children) b.setAttribute('aria-selected', b.id === 'tab-' + id);
  for (const s of stagesEl.children) s.toggleAttribute('data-active', s.id === 'stage-' + id);

  document.getElementById('thesis').textContent = v.thesis;
  document.getElementById('type').textContent = v.type;
  document.getElementById('signature').textContent = v.signature;

  if (!mounted.has(id)) {
    mounted.add(id);
    const root = document.getElementById('stage-' + id).shadowRoot;
    const src = SOURCES[id];
    root.innerHTML = '<style>' + src.css + '</style>' + src.html;
    try {
      src.run(root); // the shadow root stands in for the document
    } catch (err) {
      root.innerHTML = '<pre style="color:#E0705E;padding:24px;font:13px monospace">' + err + '</pre>';
    }
  }
  history.replaceState(null, '', '#' + id);
}

addEventListener('keydown', (e) => {
  const n = Number(e.key);
  if (n >= 1 && n <= VARIANTS.length && !e.metaKey && !e.ctrlKey) select(VARIANTS[n - 1].id);
});

select(VARIANTS.some((v) => v.id === location.hash.slice(1)) ? location.hash.slice(1) : 'a');
</script>
